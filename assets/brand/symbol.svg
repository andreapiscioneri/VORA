    <path d="M17 22 L48 78" stroke-width="9" opacity="0.55" />
    <path d="M83 22 L52 78" stroke-width="9" opacity="0.55" />
    <path d="M50 14 L50 78" stroke-width="9" />
  </g>
</svg>
